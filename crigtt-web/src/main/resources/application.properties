# Spring Boot Configuration
spring.main.web-application-type=servlet
server.servlet.context-path=/

# Activate the web application context profile
spring.profiles.active=crigtt.profile.app.context.web

# Allow bean definition overriding for legacy XML configs
spring.main.allow-bean-definition-overriding=true

# Multipart configuration - Spring Boot way
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.file-size-threshold=0

# Legacy property values for XML beans (if needed)
crigtt.servlet.dispatcher.multipart.max.size.file=20971520
crigtt.servlet.dispatcher.multipart.max.size.req=20971520

# Disable custom logback configuration for now - use Spring Boot defaults
logging.config=

# Basic logging levels - increased for debugging
logging.level.root=WARN
logging.level.org.springframework=DEBUG
logging.level.org.springframework.boot=DEBUG
logging.level.gov.hhs.onc.crigtt=DEBUG
logging.level.org.apache.catalina=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.context=DEBUG

# Show startup info
logging.level.org.springframework.boot.web.servlet.support=DEBUG
logging.level.org.springframework.boot.context=DEBUG

# Enable all actuator endpoints for debugging
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Debug Spring Boot startup
debug=true
trace=false

# Try to force console output and catch all errors
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.org.springframework.boot.diagnostics=DEBUG
