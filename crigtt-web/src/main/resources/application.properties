# Spring Boot Configuration
spring.main.web-application-type=servlet
server.servlet.context-path=/

# Disable custom logback configuration for now - use Spring Boot defaults
logging.config=

# Basic logging levels - increased for debugging
logging.level.root=WARN
logging.level.org.springframework=DEBUG
logging.level.org.springframework.boot=DEBUG
logging.level.gov.hhs.onc.crigtt=DEBUG
logging.level.org.apache.catalina=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.context=DEBUG

# Show startup info
logging.level.org.springframework.boot.web.servlet.support=DEBUG
logging.level.org.springframework.boot.context=DEBUG

# Enable all actuator endpoints for debugging
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Debug Spring Boot startup
debug=true
trace=false

# Try to force console output and catch all errors
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.org.springframework.boot.diagnostics=DEBUG
