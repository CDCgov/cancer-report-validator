# Spring Boot Configuration
spring.main.web-application-type=servlet
server.servlet.context-path=/

# Disable custom logback configuration for now - use Spring Boot defaults
logging.config=

# Basic logging levels
logging.level.org.springframework.boot=INFO
logging.level.gov.hhs.onc.crigtt=INFO
logging.level.org.apache.catalina=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.context=INFO

# Show startup info
logging.level.org.springframework.boot.web.servlet.support=DEBUG
logging.level.org.springframework.boot.context=DEBUG

# Enable all actuator endpoints for debugging
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
